<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css"/>
<style>
*{box-sizing:border-box}
body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
#map{height:100vh;width:100vw;background:#e8f0fe}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#f1f5f9;z-index:500;font-family:-apple-system,sans-serif}
#loading-dot{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#6366f1;border-radius:50%;animation:spin .7s linear infinite}
#loading-txt{font-size:12px;color:#94a3b8;font-weight:600;letter-spacing:.3px}
@keyframes spin{to{transform:rotate(360deg)}}
.ctrl{position:absolute;top:10px;left:50px;z-index:1000}
.cbtn{background:rgba(8,12,32,0.9);color:#e2e8f0;border:1px solid rgba(255,255,255,0.18);border-radius:8px;padding:7px 13px;font-size:11px;font-weight:700;cursor:pointer;backdrop-filter:blur(10px);display:inline-flex;align-items:center;gap:5px;letter-spacing:.3px;transition:all .15s}
.cbtn:hover{background:rgba(124,58,237,0.45);border-color:rgba(124,58,237,0.7);color:#ddd6fe}
.cbtn.sat{background:rgba(14,165,233,0.25);border-color:rgba(14,165,233,0.6);color:#7dd3fc}
.leaflet-popup-content-wrapper{background:#fff!important;border:1px solid #e2e8f0!important;border-radius:14px!important;box-shadow:0 8px 32px rgba(0,0,0,.18)!important;color:#1e293b!important;padding:0!important}
.leaflet-popup-tip{background:#fff!important}
.leaflet-popup-tip-container{display:none}
.leaflet-popup-close-button{color:#64748b!important;font-size:18px!important;padding:8px 10px!important;top:4px!important;right:4px!important}
.leaflet-popup-close-button:hover{color:#0f172a!important}
.leaflet-popup-content{margin:0!important;padding:0!important}
.pop{padding:13px 15px;min-width:195px}
.pop-title{font-size:13px;font-weight:700;color:#0f172a;margin-bottom:5px;line-height:1.3}
.pop-label{font-size:10px;font-weight:700;letter-spacing:.4px}
.pop-loc{color:#334155;font-size:11px;margin-top:3px;font-weight:500}
.pop-src{color:#64748b;font-size:10px;margin-top:2px}
.pop-coords{color:#94a3b8;font-size:9.5px;margin-top:3px;font-family:monospace;letter-spacing:.2px}
.gmaps-frame{width:100%;height:130px;border:1px solid #e2e8f0;border-radius:8px;margin-top:8px;display:block}
.sv-bar{display:flex;gap:4px;margin-top:6px}
.sv-btn{flex:1;font-size:9.5px;font-weight:700;padding:5px 6px;border-radius:6px;text-decoration:none;text-align:center;transition:opacity .15s;white-space:nowrap;cursor:pointer;display:inline-block;border:none}
.sv-btn:hover{opacity:.8}
</style>
</head>
<body>
<div id="loading">
  <div id="loading-dot"></div>
  <div id="loading-txt">Loading map…</div>
</div>
<div class="ctrl" id="ctrl" style="display:none">
  <button class="cbtn" id="lb" onclick="tl()">🛰 Satellite</button>
</div>
<div id="map"></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<script>
var map=null,st=null,sa=null,lblayer=null,cur='street';

function tl(){
  if(!map)return;
  if(cur==='street'){
    map.removeLayer(st);sa.addTo(map);lblayer.addTo(map);
    cur='sat';document.getElementById('lb').textContent='🗺 Street';document.getElementById('lb').classList.add('sat');
  }else{
    map.removeLayer(sa);map.removeLayer(lblayer);st.addTo(map);
    cur='street';document.getElementById('lb').textContent='🛰 Satellite';document.getElementById('lb').classList.remove('sat');
  }
}

function initMap(data){
  var loading=document.getElementById('loading');
  if(loading)loading.style.display='none';
  document.getElementById('ctrl').style.display='block';

  if(map){map.remove();map=null;}
  cur='street';

  // Street tiles: CARTO Maps API (authenticated) → OSM fallback (no watermark)
  var streetUrl = data.cartoKey
    ? 'https://basemaps-api.cartocdn.com/styles/positron/{z}/{x}/{y}.png?api_key='+data.cartoKey
    : 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
  st=L.tileLayer(streetUrl,{maxZoom:19,subdomains:'abc',attribution:''});
  sa=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:''});
  lblayer=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:''});

  map=L.map('map',{zoomControl:true,attributionControl:false}).setView(data.center,data.zoom);
  st.addTo(map);
  setTimeout(function(){map.invalidateSize();},200);

  data.pins.forEach(function(p,i){
    var c=p.isIndia?'#10b981':'#6366f1';
    var ic=L.divIcon({
      html:'<div style="background:'+c+';color:#fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;border:2.5px solid rgba(255,255,255,0.9);box-shadow:0 3px 14px rgba(0,0,0,.4),0 0 0 5px '+c+'28">'+(i+1)+'</div>',
      iconSize:[34,34],iconAnchor:[17,17],popupAnchor:[0,-19],className:''
    });
    var lbl=p.isIndia
      ?'<span class="pop-label" style="color:#059669;background:#d1fae5;padding:2px 7px;border-radius:20px;display:inline-block;margin-bottom:4px">● INDIA PRIORITY</span>'
      :'<span class="pop-label" style="color:#4f46e5;background:#ede9fe;padding:2px 7px;border-radius:20px;display:inline-block;margin-bottom:4px">● GLOBAL SUPPLIER</span>';
    var q=encodeURIComponent(p.lat+','+p.lon);
    var osmEmbed='https://www.openstreetmap.org/export/embed.html?bbox='+(p.lon-0.05)+','+(p.lat-0.05)+','+(p.lon+0.05)+','+(p.lat+0.05)+'&layer=mapnik&marker='+p.lat+','+p.lon;
    var gmUrl='https://www.google.com/maps/search/?api=1&query='+q;
    var svUrl='https://maps.google.com/?q='+p.lat+','+p.lon+'&layer=c';
    var satUrl='https://maps.google.com/?q='+p.lat+','+p.lon+'&t=k';
    var popup='<div class="pop" style="min-width:240px">'+
      '<div class="pop-title">'+p.name+'</div>'+
      lbl+
      '<div class="pop-loc">'+(p.city?p.city+', ':'')+p.country+'</div>'+
      '<div class="pop-src">via '+p.source+'</div>'+
      '<div class="pop-coords">'+p.lat.toFixed(5)+'°&nbsp;'+p.lon.toFixed(5)+'°</div>'+
      '<iframe src="'+osmEmbed+'" class="gmaps-frame" loading="lazy"></iframe>'+
      '<div class="sv-bar">'+
        '<a href="'+gmUrl+'" target="_blank" class="sv-btn" style="background:#4f46e5;color:#fff">📍 Maps</a>'+
        '<a href="'+svUrl+'" target="_blank" class="sv-btn" style="background:#d97706;color:#fff">🚶 Street</a>'+
        '<a href="'+satUrl+'" target="_blank" class="sv-btn" style="background:#0284c7;color:#fff">🛰 Sat</a>'+
      '</div>'+
    '</div>';
    L.marker([p.lat,p.lon],{icon:ic}).addTo(map).bindPopup(popup,{minWidth:255,maxWidth:280,closeButton:true});
  });

  if(data.pins.length>1){
    try{map.fitBounds(L.latLngBounds(data.pins.map(function(p){return[p.lat,p.lon]})),{padding:[45,45],maxZoom:8});}catch(e){}
  }
}

window.addEventListener('message',function(e){
  if(!e.data)return;
  if(e.data.type==='init')initMap(e.data);
  if(e.data.type==='resize'&&map)setTimeout(function(){map.invalidateSize();},60);
});

window.parent.postMessage({type:'map-ready'},'*');
</script>
</body>
</html>
