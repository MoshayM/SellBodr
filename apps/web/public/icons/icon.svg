<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="gc">
      <circle cx="215" cy="285" r="158"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" fill="url(#glow)"/>

  <!-- Globe outline -->
  <circle cx="215" cy="285" r="158" stroke="white" stroke-opacity="0.88" stroke-width="20" fill="none"/>

  <!-- Globe interior lines, clipped to circle -->
  <g clip-path="url(#gc)" stroke="white" fill="none">
    <!-- Equator -->
    <ellipse cx="215" cy="285" rx="158" ry="54" stroke-opacity="0.32" stroke-width="13"/>
    <!-- Upper latitude -->
    <ellipse cx="215" cy="210" rx="124" ry="40" stroke-opacity="0.20" stroke-width="11"/>
    <!-- Central meridian -->
    <ellipse cx="215" cy="285" rx="62" ry="158" stroke-opacity="0.26" stroke-width="13"/>
  </g>

  <!-- Arrow shaft: from globe top-right toward upper-right corner -->
  <line x1="318" y1="168" x2="418" y2="72" stroke="white" stroke-width="28" stroke-linecap="round"/>

  <!-- Arrow head: L-bracket (clean, modern, scales to 16px) -->
  <path d="M 374 50 L 446 50 L 446 122" stroke="white" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
