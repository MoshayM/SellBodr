<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Main gradient: saffron-orange (India) → deep violet (global/tech) -->
    <linearGradient id="g1" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <!-- Subtle inner glow -->
    <radialGradient id="glow" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fdba74" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" fill="url(#g1)"/>
  <rect width="100" height="100" rx="22" fill="url(#glow)"/>

  <!--
    The mark: two stacked arrowhead-capped paths forming a stylised "S" / trade-flow symbol.
    Top arc: source (India, lower-left) → global (upper-right) with outbound arrow
    Bottom arc: feedback loop, inbound, mirrored
    Combined they read as the letter S and suggest bidirectional cross-border flow.
  -->

  <!-- Top arc: curves from left to upper-right, arrow pointing out -->
  <!-- Bezier from (20,58) curving up-right to (72,28) -->
  <path d="M 20 58 C 20 35, 50 22, 72 28"
        stroke="white" stroke-width="9" stroke-linecap="round" fill="none" stroke-opacity="0.95"/>
  <!-- Arrowhead at (72,28) pointing upper-right -->
  <polyline points="58,20 72,28 65,43"
            stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-opacity="0.95"/>

  <!-- Bottom arc: mirrors, curves from right to lower-left, arrow pointing inward -->
  <!-- Bezier from (80,42) curving down-left to (28,72) -->
  <path d="M 80 42 C 80 65, 50 78, 28 72"
        stroke="white" stroke-width="9" stroke-linecap="round" fill="none" stroke-opacity="0.95"/>
  <!-- Arrowhead at (28,72) pointing lower-left -->
  <polyline points="42,80 28,72 35,57"
            stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-opacity="0.95"/>
</svg>
