<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Arrow gradient: orange (upper-right) → magenta → violet (lower-left) -->
    <linearGradient id="g" x1="74" y1="18" x2="26" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ff6420"/>
      <stop offset="48%"  stop-color="#d63fa8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Background: deep dark navy with subtle purple tint -->
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#180840"/>
      <stop offset="100%" stop-color="#040c20"/>
    </linearGradient>
    <!-- Subtle glow behind arrows -->
    <radialGradient id="glow" cx="50%" cy="50%" r="48%">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Inner glow -->
  <rect width="100" height="100" rx="22" fill="url(#glow)"/>

  <!-- Upper arc: lower-left → upper-right, tangent at end points upper-right -->
  <path d="M 22 63 C 18 28, 58 30, 72 21"
    stroke="url(#g)" stroke-width="11" stroke-linecap="round" fill="none"/>
  <!-- Upper arrowhead at (72,21), pointing upper-right -->
  <polyline points="68,32 72,21 61,20"
    stroke="url(#g)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Lower arc: upper-right → lower-left, tangent at end points lower-left -->
  <path d="M 78 37 C 82 72, 42 70, 28 79"
    stroke="url(#g)" stroke-width="11" stroke-linecap="round" fill="none"/>
  <!-- Lower arrowhead at (28,79), pointing lower-left -->
  <polyline points="32,68 28,79 39,80"
    stroke="url(#g)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
