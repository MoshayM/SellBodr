name: OWASP ZAP Security Scan

on:
  workflow_dispatch:
  schedule:
    # Weekly scan every Monday at 02:00 UTC
    - cron: '0 2 * * 1'

jobs:
  zap-baseline:
    name: ZAP Baseline (Passive) Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://sellbodr.vercel.app'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -I'
          fail_action: false
          allow_issue_writing: false
          artifact_name: 'zap-baseline-report'

  zap-full:
    name: ZAP Full (Active) Scan
    runs-on: ubuntu-latest
    needs: zap-baseline
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: 'https://sellbodr.vercel.app'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -I'
          fail_action: false
          allow_issue_writing: false
          artifact_name: 'zap-full-report'
