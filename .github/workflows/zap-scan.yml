name: OWASP ZAP Security Scan

on:
  workflow_dispatch:
  push:
    branches: [master]
  schedule:
    # Weekly scan every Monday at 02:00 UTC
    - cron: '0 2 * * 1'

jobs:
  zap-baseline:
    name: ZAP Baseline (Passive) Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://sellbodr.vercel.app'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -I'
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: report_html.html
          retention-days: 30

  zap-full:
    name: ZAP Full (Active) Scan
    runs-on: ubuntu-latest
    needs: zap-baseline
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: 'https://sellbodr.vercel.app'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -I'
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP Full Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-full-report
          path: report_html.html
          retention-days: 30
